# Local development database. Production: see compose.prod.yaml.
name: rentflow-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rentflow
      POSTGRES_USER: rentflow
      POSTGRES_PASSWORD: rentflow_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentflow -d rentflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rentflow_postgres:/var/lib/postgresql/data

volumes:
  rentflow_postgres:
