# Single-server production stack: Caddy (HTTPS + PWA) -> API -> PostgreSQL.
# Usage:
#   cp deploy/.env.production.example .env.production   # fill in real values
#   docker compose -f compose.prod.yaml --env-file .env.production up -d --build
# Prefer a managed PostgreSQL with point-in-time recovery: remove the `postgres`
# service and point DATABASE_URL at it.
name: rentflow

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rentflow
      POSTGRES_USER: rentflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentflow -d rentflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., target: api }
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: "1"
    depends_on:
      migrate: { condition: service_completed_successfully }
    expose: ["3000"]

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
      API_UPSTREAM: api:3000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres:
  caddy_data:
  caddy_config:
