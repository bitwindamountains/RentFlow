# Compose 2.24.4+: use with compose.prod.yaml for an external PostgreSQL database.
# docker compose -f compose.prod.yaml -f compose.managed.yaml --env-file .env.production up -d --build
# Put the provider's CA certificate in deploy/certs/ and reference it as
# sslcert=/etc/rentflow/db-certs/<file> in DATABASE_URL (see docs/deployment.md).
services:
  postgres:
    profiles: [bundled-database]
  migrate:
    depends_on: !reset {}
    volumes:
      - ./deploy/certs:/etc/rentflow/db-certs:ro
  api:
    volumes:
      - ./deploy/certs:/etc/rentflow/db-certs:ro
